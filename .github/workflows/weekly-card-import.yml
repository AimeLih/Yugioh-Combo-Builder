name: Weekly Yu-Gi-Oh Card Import

on:
  workflow_dispatch:

  schedule:
    # Every Sunday at 4:17 AM Chicago time
    - cron: "17 4 * * 0"
      timezone: "America/Chicago"

permissions:
  contents: read

concurrency:
  group: weekly-yugioh-card-import
  cancel-in-progress: false

jobs:
  import-new-cards:
    name: Import newly released cards
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Call protected card import endpoint
        env:
          IMPORT_URL: ${{ secrets.IMPORT_URL }}
          IMPORT_TOKEN: ${{ secrets.IMPORT_TOKEN }}
        run: |
          set -euo pipefail

          if [ -z "$IMPORT_URL" ]; then
            echo "::error::IMPORT_URL repository secret is missing"
            exit 1
          fi

          if [ -z "$IMPORT_TOKEN" ]; then
            echo "::error::IMPORT_TOKEN repository secret is missing"
            exit 1
          fi

          case "$IMPORT_URL" in
            https://*) ;;
            *)
              echo "::error::IMPORT_URL must start with https://"
              exit 1
              ;;
          esac

          response="$(curl \
            --fail-with-body \
            --show-error \
            --silent \
            --retry 3 \
            --retry-delay 10 \
            --retry-all-errors \
            --max-time 600 \
            --request POST \
            --header "X-Import-Token: $IMPORT_TOKEN" \
            "${IMPORT_URL%/}/yugioh/admin/import")"

          echo "$response" | jq .

          cards_added="$(echo "$response" | jq -r '.cardsAdded')"
          {
            echo "## Weekly card import"
            echo
            echo "Imported **${cards_added}** new card(s)."
            echo

            if [ "$cards_added" -eq 0 ]; then
              echo "No new cards were found."
            else
              echo "### Imported cards"
              echo
              echo "$response" | jq -r '.cardNames[] | "- " + .'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
